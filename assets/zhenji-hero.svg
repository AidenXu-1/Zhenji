<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 520" role="img" aria-labelledby="title desc">
  <title id="title">帧集产品能力概览</title>
  <desc id="desc">宣纸色背景上的截图、录屏和素材采集三张功能卡片</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7F4EC"/>
      <stop offset="0.52" stop-color="#EFEAE0"/>
      <stop offset="1" stop-color="#E7E0D4"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#18344F"/>
      <stop offset="1" stop-color="#31536F"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#17324B" flood-opacity="0.12"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.86" numOctaves="3" seed="27" stitchTiles="stitch" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono">
        <feFuncA type="table" tableValues="0 0.045"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <rect width="1280" height="520" rx="34" fill="url(#paper)"/>
  <rect width="1280" height="520" rx="34" filter="url(#grain)" opacity="0.8"/>
  <circle cx="1134" cy="84" r="178" fill="#D7E8E4" opacity="0.42"/>
  <circle cx="90" cy="470" r="156" fill="#D9C9B8" opacity="0.28"/>
  <g transform="translate(76 74)">
    <rect width="390" height="372" rx="28" fill="url(#ink)" filter="url(#shadow)"/>
    <text x="36" y="56" fill="#D8EAE6" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="17" letter-spacing="3">ZHENJI FOR macOS</text>
    <text x="36" y="120" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="46" font-weight="700">捕捉灵感</text>
    <text x="36" y="174" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="46" font-weight="700">整理每一帧</text>
    <text x="36" y="224" fill="#C7D8E2" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20">截图、录屏、采集，一次完成</text>
    <rect x="36" y="276" width="214" height="52" rx="26" fill="#F6F2E9"/>
    <circle cx="64" cy="302" r="8" fill="#2D806F"/>
    <text x="84" y="310" fill="#1E3D58" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="19" font-weight="600">内容留在本机</text>
  </g>
  <g transform="translate(506 104)" filter="url(#shadow)">
    <g>
      <rect width="208" height="312" rx="26" fill="#FCFBF7" stroke="#D9D1C5"/>
      <rect x="26" y="28" width="64" height="64" rx="18" fill="#DCEBE8"/>
      <path d="M45 48h26v26H45zM51 55h14v12H51z" fill="none" stroke="#28506B" stroke-width="3" stroke-linejoin="round"/>
      <text x="26" y="132" fill="#203B52" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="27" font-weight="700">截图</text>
      <text x="26" y="170" fill="#687681" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="17">框选 · 标注</text>
      <text x="26" y="198" fill="#687681" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="17">长图 · OCR</text>
      <path d="M26 250h156" stroke="#E5DED4"/>
      <text x="26" y="280" fill="#2B7768" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="600">快捷键即刻开始</text>
    </g>
    <g transform="translate(232 0)">
      <rect width="208" height="312" rx="26" fill="#FCFBF7" stroke="#D9D1C5"/>
      <rect x="26" y="28" width="64" height="64" rx="18" fill="#E8DFD3"/>
      <circle cx="58" cy="60" r="15" fill="none" stroke="#28506B" stroke-width="3"/>
      <circle cx="58" cy="60" r="6" fill="#B64B43"/>
      <text x="26" y="132" fill="#203B52" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="27" font-weight="700">录屏</text>
      <text x="26" y="170" fill="#687681" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="17">画面 · 声音</text>
      <text x="26" y="198" fill="#687681" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="17">标记 · 编辑</text>
      <path d="M26 250h156" stroke="#E5DED4"/>
      <text x="26" y="280" fill="#2B7768" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="600">本地完成导出</text>
    </g>
    <g transform="translate(464 0)">
      <rect width="208" height="312" rx="26" fill="#FCFBF7" stroke="#D9D1C5"/>
      <rect x="26" y="28" width="64" height="64" rx="18" fill="#E1E5EC"/>
      <path d="M43 50h30v22H43zM49 44h30v22" fill="none" stroke="#28506B" stroke-width="3" stroke-linejoin="round"/>
      <text x="26" y="132" fill="#203B52" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="27" font-weight="700">采集</text>
      <text x="26" y="170" fill="#687681" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="17">文件 · 文字</text>
      <text x="26" y="198" fill="#687681" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="17">筛选 · 批量拖出</text>
      <path d="M26 250h156" stroke="#E5DED4"/>
      <text x="26" y="280" fill="#2B7768" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="600">一处持续整理</text>
    </g>
  </g>
</svg>
